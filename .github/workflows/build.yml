name: Shikshak build

on:
  push:
    branches: [main, dev/backend-test, dev/pricing-verification-roles]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Verify Supabase HTTP gateway
        run: npm run test:backend
      - name: Verify authentication and classroom workflows
        run: npm run test:platform
      - name: Verify browser-local demo and sample workflows
        run: npm run test:browser-demo
      - name: Verify browser PDF note uploads, teacher/student access and cleanup
        run: npm run test:pdf-notes
      - name: Verify city/locality reverse geocoding and coarse pins
        run: npm run test:home-area
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/dry-run
