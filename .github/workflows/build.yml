name: Shikshak build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Verify authentication and classroom workflows
        run: npm run test:platform
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler/dry-run
